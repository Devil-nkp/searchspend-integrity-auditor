<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>SearchSpend Integrity Auditor — WebAssembly Edition</title>
  <meta name="description" content="Stop false Google Ads waste claims before they cost businesses money. Client-side WebAssembly audit engine." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>" />

  <!-- Pinned Stlite Browser v1.12.0 Stylesheet -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.css" />

  <style>
    /* Dark Navy Background before WASM mount */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0B0F19;
      color: #F1F5F9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }
  </style>

  <!-- Pinned Stlite Browser v1.12.0 JavaScript Module -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js"></script>
</head>
<body>
  <!-- Stlite Custom Element Mount -->
  <streamlit-app src="./app.py">
    <!-- Python Domain & Calculation Engine Files -->
    <app-file name="src/recovery/__init__.py" url="./src/recovery/__init__.py"></app-file>
    <app-file name="src/recovery/domain.py" url="./src/recovery/domain.py"></app-file>
    <app-file name="src/recovery/accuracy.py" url="./src/recovery/accuracy.py"></app-file>
    <app-file name="src/recovery/audit.py" url="./src/recovery/audit.py"></app-file>
    <app-file name="src/recovery/csv_ingestion.py" url="./src/recovery/csv_ingestion.py"></app-file>
    <app-file name="src/recovery/demo_data.py" url="./src/recovery/demo_data.py"></app-file>
    <app-file name="src/recovery/google_ads/__init__.py" url="./src/recovery/google_ads/__init__.py"></app-file>
    <app-file name="src/recovery/google_ads/adapter.py" url="./src/recovery/google_ads/adapter.py"></app-file>
    <app-file name="src/recovery/google_ads/gaql.py" url="./src/recovery/google_ads/gaql.py"></app-file>

    <!-- Synthetic Benchmark Sample Datasets -->
    <app-file name="demo_data/demo_search_terms.csv" url="./demo_data/demo_search_terms.csv"></app-file>
    <app-file name="demo_data/demo_campaign_spend.csv" url="./demo_data/demo_campaign_spend.csv"></app-file>

    <!-- Streamlit Dark Theme & Server Configuration -->
    <app-file name=".streamlit/config.toml" url="./.streamlit/config.toml"></app-file>

    <!-- Pyodide Package Requirements -->
    <app-requirements>
      pandas
      altair
    </app-requirements>
  </streamlit-app>
</body>
</html>
