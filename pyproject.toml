[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "google-ads-recovery-core"
version = "0.1.0"
description = "Accuracy-first core for Google Ads search-term waste analysis"
requires-python = ">=3.11,<3.15"
dependencies = [
  "google-ads==34.0.0",
  "pandas>=2.0.0",
]

[project.optional-dependencies]
app = [
  "streamlit>=1.35.0",
  "altair>=5.0.0",
]
dev = [
  "pytest>=8.3,<10",
  "streamlit>=1.35.0",
  "altair>=5.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
